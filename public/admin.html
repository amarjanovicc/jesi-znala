<style>

.r { text-align: right }

.login form { background: var(--panel); border: 1px solid var(--line); padding: 18px }

    h('tbody', {}, p.letters.slice().reverse().map(function (l) { return h('tr', {}, h('td', { class: 'no' }, pad(l.i + 1)), h('td', {}, (l.lk ? '♥ ' : '') + l.title), h('td', { class: 'hide-s' }, l.d ? dm(new Date(l.d)) : ''), h('td', { class: 'r ' + (l.score === 3 ? 'st-ok' : '') }, l.score + '/3' + (l.learned ? ' · zapamćeno' : ''))); }))));
}

/* ---------- obavijesti ---------- */
async function viewNotify(page) {
  loading(page);
  var r = await api('status'); clear(page);
  if (!r.ok) { page.appendChild(note('Ne mogu učitati stanje.', 'err')); return; }
  var s = r.j, ch = s.channels, any = ch.ntfy || ch.telegram || ch.email, topic = stableTopic(), out = h('div', { 'aria-live': 'polite' });
  var row = function (n, on, vars) { return h('tr', {}, h('td', {}, n), h('td', { class: on ? 'st-ok' : 'st-off' }, on ? 'postavljeno' : 'nije postavljeno'), h('td', { class: 'mute hide-s' }, vars)); };
  page.appendChild(h('h2', {}, 'Stanje'));
  page.appendChild(h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Dio'), h('th', {}, 'Stanje'), h('th', { class: 'hide-s' }, 'Varijable'))),
    h('tbody', {}, h('tr', {}, h('td', {}, 'Baza'), h('td', { class: s.storage ? 'st-ok' : 'st-bad' }, s.storage ? 'radi' : 'nije povezana'), h('td', { class: 'mute hide-s' }, 'KV_REST_API_URL, KV_REST_API_TOKEN')),
      row('ntfy', ch.ntfy, 'NTFY_TOPIC'), row('Telegram', ch.telegram, 'TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID'), row('E-pošta (Resend)', ch.email, 'RESEND_API_KEY, NOTIFY_EMAIL'))));
  page.appendChild(h('p', { class: 'mute small', style: 'margin-top:10px' }, 'Obavijest stiže kad povezani igrač uđe u igru (najviše jednom u 30 minuta), odigra pismo ili nedjeljnu razglednicu. Uređaji koji nisu povezani sinkronizacijom ne mogu se pratiti.'));
  page.appendChild(h('div', { class: 'tools' }, h('button', { class: 'btn primary', disabled: !any, onclick: async function (e) { e.target.disabled = true; var x = await api('testNotify', {}); e.target.disabled = !any; clear(out).appendChild(x.ok && x.j.sent.length ? note('Poslano preko: ' + x.j.sent.join(', ') + '. Provjeri mobitel.') : note('Nijedan kanal nije uspio poslati. Provjeri postavke.', 'err')); } }, 'Pošalji probnu obavijest')));
  page.appendChild(out);
  page.appendChild(h('h2', {}, 'Postavljanje: ntfy (bez računa)'));
  page.appendChild(h('ol', { class: 'steps' }, h('li', {}, 'Instaliraj aplikaciju ', h('strong', {}, 'ntfy'), ' (App Store ili Google Play) i pretplati se na ovaj tajni naziv teme:', h('code', { style: 'margin-top:6px' }, topic), h('button', { class: 'link small', onclick: function (e) { copy(e.target, topic); } }, 'Kopiraj naziv')),
    h('li', {}, 'U Vercelu dodaj tajnu varijablu ', h('strong', {}, 'NTFY_TOPIC'), ' s istim nazivom (Settings, Environment Variables), pa ponovo objavi projekt.'),
    h('li', {}, 'Vrati se ovamo i pošalji probnu obavijest.')));
  page.appendChild(h('p', { class: 'mute small' }, 'Tko zna naziv teme, može čitati obavijesti, pa neka ostane tajan. Obavijesti sadrže samo ono što je odigrala, npr. „Ona: № 04 „Naslov” 2/3”.'));
  page.appendChild(h('details', {}, h('summary', {}, 'Telegram ili e-pošta umjesto ntfy'), h('p', { class: 'mute small', style: 'margin-top:8px' }, 'Telegram: napravi bota kod @BotFather, pa postavi TELEGRAM_BOT_TOKEN i TELEGRAM_CHAT_ID. E-pošta (Resend): postavi RESEND_API_KEY i NOTIFY_EMAIL. Nakon svake nove varijable treba nova objava.')));
}

/* ---------- start ---------- */
async function start() {
  if (!TOKEN) return renderLogin();
  var r; try { r = await api('status'); } catch (e) { return; }
  if (!r.ok) return renderLogin();
  render();
}
start();
</script>
